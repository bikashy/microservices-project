#spring.application.name=api-getway

server:
  port: 8080

spring:
  application:
    name: api-getway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventory-service
#              uri: http://localhost:9010
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v2/products/**,/api/v2/fetchOrder/**
              filters:
                - StripPrefix=2
#                - RedirectTo=302,https://google.com

            - id: order-service
#              uri: http://localhost:9012
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/**
              filters:
#                 - StripPrefix =2
                - RewritePath=/api/v1/(?<segment>.*), /${segment}
